<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Around The U.S.</title>
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="<%=require('./images/Vectorlogo.svg')%>"
          alt="Around the U.S. logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="<%=require('./images/jacques-cousteau.jpg')%>"
            alt="avatar"
            class="profile__avatar"
          />
          <div class="profile__info">
            <h1 class="profile__name" type="text"></h1>
            <button
              class="profile__edit-button"
              id="profile-edit-button"
              type="button"
            ></button>
            <p class="profile__about" type="text"></p>
          </div>
          <button
            class="profile__add-button"
            id="add-card-button"
            type="button"
          ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">&copy; 2024 Around the U.S.</p>
      </footer>
    </div>
    <!-- edit modal-->
    <div class="modal" id="profile-edit-modal">
      <div class="modal__container">
        <button class="modal__close" id="modal-close-button"></button>
        <h2 class="modal__heading">Edit profile</h2>
        <form class="modal__form">
          <input
            type="text"
            name="name"
            class="modal__input"
            id="profile-title-input"
            placeholder="Name"
            required
            minlength="2"
            maxlength="40"
          />
          <span class="modal__error" id="profile-title-input-error"></span>
          <input
            type="text"
            name="about"
            class="modal__input"
            id="profile-description-input"
            placeholder="Description"
            required
            minlength="2"
            maxlength="200"
          />
          <span
            class="modal__error"
            id="profile-description-input-error"
          ></span>
          <button
            class="modal__button modal__button_disabled"
            id="submit-button"
            type="submit"
          >
            Save
          </button>
        </form>
      </div>
    </div>
    <!-- add card modal-->
    <div class="modal" id="add-card-modal">
      <div class="modal__container">
        <button class="modal__close" id="modal-close-button"></button>
        <h2 class="modal__heading">New Place</h2>
        <form class="modal__form">
          <input
            type="text"
            name="title"
            class="modal__input"
            id="card-title-input"
            placeholder="Title"
            required
            minlength="1"
            maxlength="30"
          />
          <span class="modal__error" id="card-title-input-error"></span>
          <input
            type="url"
            name="url"
            class="modal__input"
            id="card-url-input"
            placeholder="Image Url"
            required
          />
          <span class="modal__error" id="card-url-input-error"></span>
          <button
            class="modal__button modal__button_disabled"
            id="submit-button"
            type="submit"
            disabled
          >
            Save
          </button>
        </form>
      </div>
    </div>
    <!-- preview modal -->
    <div class="modal" id="preview-image-modal">
      <div class="modal__preview-container">
        <button class="modal__close" id="preview-modal-close"></button>
        <img class="modal__image" id="modal-image" src="" />
        <div class="modal__title" id="preview-title"></div>
      </div>
    </div>
    <!-- delete card modal-->
    <div class="modal" id="delete-card-modal">
      <div class="modal__delete-container">
        <button class="modal__close" id="modal-close-button"></button>
        <h2 class="modal__heading modal__delete-heading">Are you sure?</h2>

        <form class="modal__form">
          <button
            class="modal__button modal__delete-button"
            id="delete-card-button"
            type="submit"
          >
            Yes
          </button>
        </form>
      </div>
    </div>

    <template id="card-template">
      <li class="card" id="card">
        <img src="" alt="" id="" class="card__image" />
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button class="card__like-button" type="button"></button>
          <button
            class="card__delete-button"
            id="card-delete-button"
            type="button"
          ></button>
        </div>
      </li>
    </template>
  </body>
</html>
